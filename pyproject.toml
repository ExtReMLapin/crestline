[project]
name = "crestline"
version = "0.2.0"
description = "Find where a mountain photo was taken, without GPS, from its skyline."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pillow",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "segmentation-models-pytorch>=0.5.0",
    "timm>=1.0",
    "safetensors",
    "huggingface-hub",
]

[project.optional-dependencies]
# reproduire l'entraînement de Crestline et les évaluations (scripts/)
research = [
    "torchvision",
    "transformers>=4.45",
    "accelerate",
    "matplotlib",
    "scipy",
    "opencv-python-headless",
    "exifread",
    "tqdm",
    "pandas>=2",
]
dev = ["pytest"]

[project.scripts]
crestline = "crestline.cli:main"

[project.urls]
Repository = "https://github.com/ExtReMLapin/crestline"
Model = "https://huggingface.co/LPN64/crestline-convnext-base"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crestline"]

[tool.hatch.build.targets.sdist]
include = ["crestline", "tests", "README.md", "README_FR.md", "LICENSE"]

# Développement avec uv : torch CUDA 13 (RTX 50xx)
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
